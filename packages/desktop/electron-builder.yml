appId: com.bendyline.docblocks
productName: DocBlocks
copyright: Copyright © 2026 Bendyline

directories:
  output: dist/artifacts
  buildResources: resources

# Templated so release artifacts carry the version + platform in their
# filename (e.g. DocBlocks-<version>-mac-arm64.dmg). Overrides the stock
# "DocBlocks Setup <version>.exe" naming.
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

files:
  - dist/main/**/*
  - dist/preload/**/*
  - dist/renderer/**/*
  # Defense in depth for opt-in diagnostic builds: source maps never belong in
  # a distributable app.asar.
  - '!dist/**/*.map'
  - '!node_modules/**/*.map'
  - '!node_modules/**/*.flow'
  - package.json

# Legal materials that must remain directly readable beside app.asar.
extraResources:
  - from: THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt

# Electron's own license and Chromium notice are supplied by the exact Electron
# archive that electron-builder extracts for this platform and architecture.
# Copying them from that staging tree also works when npm skips Electron's
# separate node_modules binary download, as the dedicated CI jobs do.
afterExtract: scripts/copy-electron-licenses.cjs

# Lock production binaries to the signed ASAR and disable Node/Electron
# environment-variable escape hatches that the app does not use.
electronFuses:
  # Flipping fuses modifies Electron Framework after its linker signature was
  # created. Unsigned local Apple Silicon builds are not followed by
  # electron-builder's Developer ID signing pass, so restore a valid ad-hoc
  # signature here; signed release builds replace it immediately afterward.
  resetAdHocDarwinSignature: true
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  # Only enable this when packaging a generated
  # browser_v8_context_snapshot.bin. Electron's stock distribution does not
  # contain one and exits fatally at startup when this fuse is enabled.
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: false

# electron-builder auto-detects native modules with .node bindings and
# unpacks them into app.asar.unpacked automatically. Adding an explicit
# `asarUnpack` list here is only necessary for runtime resources that
# the packager can't discover on its own.
# Leave this block commented until that need arises — in a monorepo,
# `**/node_modules/...` globs can match workspace symlinks and fail the
# build with "must be under <app-dir>" errors.

# Auto-update configuration — electron-updater checks this repo for releases.
# The release workflow uploads installers + latest.yml to GitHub Releases.
publish:
  provider: github
  owner: bendyline
  repo: docblocks

# Windows configuration
win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
  icon: resources/icon.png
  executableName: DocBlocks
  # electron-builder 26 moved signtool options under `signtoolOptions`.
  signtoolOptions:
    publisherName: 'Bendyline LLC'
    sign: scripts/sign.cjs
    signingHashAlgorithms:
      - sha256

nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  license: LICENSE.txt
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico
  installerSidebar: installer/sidebar.bmp
  uninstallerSidebar: installer/sidebar.bmp

# Microsoft Store build variant — built with `electron-builder --win appx`.
# The Store re-signs the package, so it is left unsigned here (the Azure
# Trusted Signing hook only applies to the nsis target's signtoolOptions).
# Auto-update is disabled at runtime via process.windowsStore. The identity
# values below MUST match the app reservation in Partner Center exactly —
# see RELEASING.md. Tile assets are read from resources/appx/ if present,
# otherwise electron-builder generates them from resources/icon.png.
appx:
  identityName: BendylineLLC.DocBlocks
  publisher: CN=791A4319-B5A9-4402-928A-D644A8E3351D
  publisherDisplayName: Bendyline, LLC
  applicationId: DocBlocks
  displayName: DocBlocks
  backgroundColor: '#1e1e1e'
  languages:
    - en-US

# macOS configuration
# Signing uses the "Developer ID Application" certificate from the keychain.
# Notarization is electron-builder's built-in notarytool step, auto-enabled
# when APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID are in the env
# (CI only) — it also staples the ticket. No custom afterSign hook needed.
mac:
  target:
    # dmg is the human-facing download; zip is what electron-updater installs
    # from on macOS (it cannot auto-install from a .dmg). latest-mac.yml points
    # at the zip — omitting it silently breaks macOS auto-update.
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  icon: resources/icon.icns
  category: public.app-category.productivity
  # Release builds keep the hardened runtime. The unpacked `dist:dir` smoke
  # build overrides this to false: ad-hoc signatures have no shared Team ID,
  # so macOS library validation rejects Electron Framework before startup.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: entitlements.mac.plist
  entitlementsInherit: entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: DocBlocks accesses the camera only when you choose to record video for a document.
    NSMicrophoneUsageDescription: DocBlocks accesses the microphone only when you choose to record audio or video for a document.
    NSAudioCaptureUsageDescription: DocBlocks accesses system audio only when you choose to include it in a screen recording.
    # Electron's base Info.plist declares generic Bluetooth prompts. DocBlocks
    # does not use Bluetooth; null removes inherited keys after plist merging.
    NSBluetoothAlwaysUsageDescription: null
    NSBluetoothPeripheralUsageDescription: null

# Mac App Store build variant — built with `electron-builder --mac mas`.
# Runs inside the App Sandbox (distinct from the Developer ID `mac` block
# above, which notarizes for direct download). Auto-update is disabled at
# runtime via process.mas. Requires an "Apple Distribution" + "Mac Installer
# Distribution" cert and a Mac App Store provisioning profile — see RELEASING.md.
mas:
  entitlements: entitlements.mas.plist
  entitlementsInherit: entitlements.mas.inherit.plist
  # Provisioning profile for com.bendyline.docblocks, downloaded from the
  # Apple Developer portal. Injected at build time in CI; not committed.
  provisioningProfile: embedded.provisionprofile
  # The sandbox replaces the hardened runtime for MAS.
  hardenedRuntime: false

dmg:
  # electron-builder defaults `sign` to false, so the .dmg shipped unsigned even
  # though the .app inside it was signed, notarized, and stapled. The app still
  # launched correctly, but the container the user actually downloads assessed as
  # "rejected: no usable signature" under Gatekeeper. Signing alone is not enough
  # — Gatekeeper wants a notarization ticket for the disk image itself — so the
  # release workflow submits each .dmg to notarytool and staples it after this
  # build step. Keep the two in sync: signing here without notarizing there is
  # the one combination electron-builder warns produces confusing failures.
  sign: true
  # `stapler staple` rewrites the .dmg in place, which would invalidate any
  # blockmap or sha512/size electron-builder had already recorded for it. The
  # macOS updater never reads the .dmg anyway — MacUpdater calls
  # findFile(files, 'zip', ['pkg', 'dmg']) — so keep the disk image out of
  # latest-mac.yml entirely rather than publishing hashes that stapling breaks.
  writeUpdateInfo: false
  # Uncomment once a proper dmg background asset is designed.
  # background: resources/dmg-background.png
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# Linux configuration — ship AppImage and .deb (Debian/Ubuntu) for x64 and arm64.
# Snap and Flatpak are available on-demand via `--linux snap` / `--linux flatpak`;
# they require extra host tooling (snapcraft / flatpak-builder) and are therefore
# not in the default targets list.
linux:
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
  # Use a freedesktop size set rather than only the 1024px master. Several
  # desktop environments do not index 1024x1024 hicolor entries, which leaves
  # the installed application with a generic launcher icon.
  icon: icons
  # BrowserWindow and the tray need a runtime-readable icon as well. Build
  # resources are not copied into process.resourcesPath automatically.
  extraResources:
    - from: resources/icon.png
      to: resources/icon.png
  category: Office
  # Required by the .deb (fpm) target. Kept here rather than as an author email
  # in package.json so the package author field stays consistent with the other
  # workspace packages.
  maintainer: Bendyline <support@bendyline.com>
  synopsis: Markdown document editor
  description: DocBlocks - a Markdown editor, converter, and publisher.

deb:
  packageCategory: editors

snap:
  grade: stable
  confinement: strict
  plugs:
    - default
    - home
    - removable-media

flatpak:
  runtime: org.freedesktop.Platform
  runtimeVersion: '23.08'
  sdk: org.freedesktop.Sdk
  finishArgs:
    - --share=ipc
    - --socket=x11
    - --socket=wayland
    - --device=dri
    - --filesystem=home
    - --share=network
    - --talk-name=org.freedesktop.Notifications

# Protocol handler for deep links (docblocks://open?path=/abs/path)
protocols:
  - name: DocBlocks
    schemes:
      - docblocks

# Register markdown extensions + the DocBlocks bundle (.dbk) so OS "Open With"
# routes here. `role: Editor` marks DocBlocks as an editor (not just a viewer),
# so it can be set as the default handler.
fileAssociations:
  - ext: md
    name: Markdown Document
    role: Editor
    description: Markdown document
    mimeType: text/markdown
    icon: resources/icon.png
  - ext: markdown
    name: Markdown Document
    role: Editor
    icon: resources/icon.png
  - ext: mdown
    name: Markdown Document
    role: Editor
    icon: resources/icon.png
  - ext: mkd
    name: Markdown Document
    role: Editor
    icon: resources/icon.png
  - ext: mdx
    name: Markdown Document
    role: Editor
    icon: resources/icon.png
  - ext: dbk
    name: DocBlocks Bundle
    role: Editor
    description: DocBlocks bundle
    mimeType: application/vnd.docblocks+zip
    icon: resources/icon.png
