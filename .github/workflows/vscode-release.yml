##
# VS Code Extension Release Workflow
#
# Packages the extension version declared in packages/vscode/package.json and
# creates a GitHub Release with the VSIX attached. Marketplace publishing is an
# explicit opt-in and requires a repository secret named VSCE_PAT.
##

name: Release VS Code Extension

on:
  workflow_dispatch:
    inputs:
      publish_marketplace:
        description: 'Publish the VSIX to the Visual Studio Marketplace'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: 'vscode-release'
  cancel-in-progress: false

jobs:
  quality:
    name: Canonical Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Setup governed npm
        uses: ./.github/actions/setup-npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright runtime
        run: |
          npx playwright install --with-deps chromium firefox webkit
          npm exec -w @bendyline/docblocks-cli -- playwright-core install chromium

      - name: Run canonical quality gate
        run: xvfb-run -a npm run all

      # A release gate runs the same suites as CI on identical code, so what it
      # catches is usually a timing race CI happened to miss. Without these the
      # only evidence is a log line, and a race rarely reproduces on demand.
      - name: Upload E2E diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: quality-gate-playwright-diagnostics
          path: |
            playwright-report/
            playwright-report-offline/
            playwright-report-cross-browser/
            test-results/
            packages/vscode/playwright-report/
            packages/vscode/test-results/
            packages/desktop/playwright-report/
            packages/desktop/test-results/
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Package and Release VSIX
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Setup governed npm
        uses: ./.github/actions/setup-npm

      - name: Install dependencies
        run: npm ci

      - name: Build upstream packages
        run: npm run build:core && npm run build:react

      - name: Read extension version
        id: extension
        shell: bash
        run: |
          version="$(node --print "require('./packages/vscode/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=vscode-v$version" >> "$GITHUB_OUTPUT"
          echo "vsix=packages/vscode/docblocks-vscode-$version.vsix" >> "$GITHUB_OUTPUT"

      - name: Require Marketplace publishing token
        if: inputs.publish_marketplace
        shell: bash
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [[ -z "$VSCE_PAT" ]]; then
            echo '::error::VSCE_PAT must be configured to publish to the Visual Studio Marketplace.'
            exit 1
          fi

      - name: Package VS Code extension
        run: npm run package:vscode

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.extension.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: DocBlocks for VS Code v${{ steps.extension.outputs.version }}
          generate_release_notes: true
          make_latest: false
          fail_on_unmatched_files: true
          files: ${{ steps.extension.outputs.vsix }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Visual Studio Marketplace
        if: inputs.publish_marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VSIX_PATH: ${{ steps.extension.outputs.vsix }}
        run: npm exec --workspace docblocks-vscode -- vsce publish --packagePath "$VSIX_PATH" --skip-duplicate
