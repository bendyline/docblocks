##
# Desktop App Release Workflow
#
# Builds, signs, and publishes the DocBlocks desktop app for Windows,
# macOS, and Linux. Creates a GitHub Release with all platform installers
# attached. electron-updater (integrated in the app) detects these
# releases for automatic updates.
#
# Trigger:
#   - Manual dispatch
#   - Git tag matching `desktop-v*` (e.g., desktop-v0.1.0)
#
# Versioning:
#   packages/desktop/package.json is the release version source of truth.
#   Bump it before releasing; artifacts, the bundled VSIX, and release tags use
#   that clean x.y.z.
#
# Prerequisites (one-time setup):
#   Windows signing:  Azure Trusted Signing resource + GitHub secrets
#   macOS signing:    Apple Developer certificate + GitHub secrets
#   See packages/desktop/scripts/sign.cjs and RELEASING.md for env vars.
##

name: Release Desktop App

on:
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create as draft release (uncheck to publish immediately)'
        required: false
        default: true
        type: boolean
  push:
    tags:
      - 'desktop-v*'

# Least privilege by default: checkout is all most jobs need, and the build
# jobs package with `--publish never`, so nothing but `release` writes to the
# repo. artifact upload/download authenticate with the Actions runtime token
# rather than GITHUB_TOKEN, so they need no `contents` grant either. The
# `release` job declares its own `contents: write` where it creates the release.
permissions:
  contents: read

jobs:
  quality:
    name: Canonical Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright runtime
        run: |
          npx playwright install --with-deps chromium firefox webkit
          npm exec -w @bendyline/docblocks-cli -- playwright-core install chromium

      - name: Run canonical quality gate
        run: xvfb-run -a npm run all

  # ──────────────────────────────────────────────────────────────────────────
  # Windows — Build + required Authenticode signing (Azure Trusted Signing)
  # ──────────────────────────────────────────────────────────────────────────
  build-windows:
    needs: quality
    runs-on: windows-latest
    # Job-level so step `if:` conditionals can read it — a step's own `env:`
    # block is NOT visible to that same step's `if:`.
    env:
      SIGNING_CONFIGURED: ${{ secrets.AZURE_CODE_SIGNING_ENDPOINT != '' && secrets.AZURE_CODE_SIGNING_ACCOUNT != '' && secrets.AZURE_CERT_PROFILE_NAME != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_CLIENT_SECRET != '' }}
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Require Windows release signing
        if: env.SIGNING_CONFIGURED != 'true'
        shell: pwsh
        run: throw 'Windows signing is required for release artifacts; configure every Azure Trusted Signing secret.'

      - name: Read version
        id: version
        run: |
          $version = node -p "require('./packages/desktop/package.json').version"
          echo "version=$version" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Build upstream packages
        run: npm run build

      - name: Install Trusted Signing SDK
        shell: pwsh
        run: |
          if (-not $env:SIGNING_ENDPOINT) {
            Write-Host "[signing] No AZURE_CODE_SIGNING_ENDPOINT secret — skipping SDK install"
            exit 0
          }
          nuget install Microsoft.Trusted.Signing.Client -Version 1.0.60 -OutputDirectory "${{ runner.temp }}\TrustedSigning"
          $dlibDir = Get-ChildItem "${{ runner.temp }}\TrustedSigning\Microsoft.Trusted.Signing.Client.*\bin\x64" -Directory | Select-Object -First 1
          echo "TRUSTED_SIGNING_DLIB_PATH=$($dlibDir.FullName)\Azure.CodeSigning.Dlib.dll" >> $env:GITHUB_ENV
          $metadata = @{
            Endpoint = "$env:SIGNING_ENDPOINT"
            CodeSigningAccountName = "$env:SIGNING_ACCOUNT"
            CertificateProfileName = "$env:SIGNING_PROFILE"
          } | ConvertTo-Json
          $metadataPath = "${{ runner.temp }}\metadata.json"
          Set-Content -Path $metadataPath -Value $metadata
          echo "TRUSTED_SIGNING_METADATA_PATH=$metadataPath" >> $env:GITHUB_ENV
        env:
          SIGNING_ENDPOINT: ${{ secrets.AZURE_CODE_SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ secrets.AZURE_CERT_PROFILE_NAME }}

      # Invoke electron-builder directly rather than via `npm run dist:win --
      # --publish never`: on Windows, npm/cmd swallows `--publish` (treats it as
      # an npm config) and passes only `never`, which electron-builder then reads
      # as an unknown build target. Passing the flag straight through avoids that.
      - name: Build + package desktop (Windows)
        working-directory: packages/desktop
        run: |
          npm run build
          npx --no-install electron-builder --win --publish never
        env:
          TRUSTED_SIGNING_DLIB_PATH: ${{ env.TRUSTED_SIGNING_DLIB_PATH }}
          TRUSTED_SIGNING_METADATA_PATH: ${{ env.TRUSTED_SIGNING_METADATA_PATH }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Verify Windows signature (fail if unsigned)
        shell: pwsh
        run: |
          # Catch missing architecture builds and signing no-ops before an
          # installer can reach the release job. electron-builder also emits a
          # combined installer when both architectures are configured.
          foreach ($arch in @('x64', 'arm64')) {
            $architectureInstaller = Get-ChildItem "packages/desktop/dist/artifacts/*-win-$arch.exe"
            if (-not $architectureInstaller) { throw "No Windows $arch installer produced" }
          }
          $installers = Get-ChildItem packages/desktop/dist/artifacts/*.exe
          if (-not $installers) { throw "No .exe produced to verify" }
          foreach ($installer in $installers) {
            $sig = Get-AuthenticodeSignature $installer.FullName
            Write-Host "Signature status for $($installer.Name): $($sig.Status)"
            if ($sig.Status -ne 'Valid') {
              throw "Expected a valid Authenticode signature for $($installer.Name) but got '$($sig.Status)'"
            }
          }

      # electron-builder merges the x64, arm64, and combined NSIS installers
      # into latest.yml. electron-updater does not architecture-filter Windows
      # entries, so publish only the combined installer in updater metadata.
      # The per-architecture installers remain uploaded as manual assets.
      - name: Prepare Windows updater manifest
        run: npm run prepare:windows-updater -w docblocks-desktop

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-artifacts
          path: |
            packages/desktop/dist/artifacts/*.exe
            packages/desktop/dist/artifacts/*.exe.blockmap
            packages/desktop/dist/artifacts/latest.yml
          retention-days: 14

  # ──────────────────────────────────────────────────────────────────────────
  # macOS — Build + sign + notarize
  # ──────────────────────────────────────────────────────────────────────────
  build-macos:
    needs: quality
    # Keep release signing on the image that is known to work with the current
    # Electron toolchain. `macos-latest` moved from macOS 15 to macOS 26 and
    # codesign began returning signatures without the required secure timestamp.
    runs-on: macos-15
    # Job-level so step `if:` conditionals can read it — a step's own `env:`
    # block is NOT visible to that same step's `if:`.
    env:
      SIGNING_CONFIGURED: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_ID != '' && secrets.APPLE_ID_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Require macOS release signing and notarization
        if: env.SIGNING_CONFIGURED != 'true'
        run: |
          echo 'macOS signing and notarization are required for release artifacts.' >&2
          exit 1

      - name: Build upstream packages
        run: npm run build

      - name: Import Apple certificate
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE_P12_BASE64" ]; then
            echo "[signing] No APPLE_CERTIFICATE_P12_BASE64 secret — skipping certificate import"
            exit 0
          fi
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain

      - name: Build + package desktop (macOS)
        working-directory: packages/desktop
        run: |
          sudo launchctl limit maxfiles 524288 524288
          ulimit -n 524288
          npm run build

          # Apple's timestamp service can occasionally return a signature with
          # no secure timestamp. Retry only that exact transient failure; all
          # other packaging failures remain immediate and actionable.
          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            log="$RUNNER_TEMP/electron-builder-macos-$attempt.log"
            set +e
            npx --no-install electron-builder --mac --publish never 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            set -e

            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if ! grep -Fq 'A timestamp was expected but was not found.' "$log" || [ "$attempt" -eq "$max_attempts" ]; then
              exit "$status"
            fi

            echo "::warning::Apple secure timestamping failed on attempt $attempt; retrying a clean package."
            rm -rf dist/artifacts
            sleep $((attempt * 15))
          done
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          # electron-builder's built-in notarytool reads APPLE_APP_SPECIFIC_PASSWORD.
          # The APPLE_ID_PASSWORD secret already holds an app-specific password.
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          UV_THREADPOOL_SIZE: 16

      - name: Verify macOS signing (fail if unsigned)
        run: |
          # codesign and the notarization staple are both mandatory release gates.
          APP=$(find packages/desktop/dist/artifacts -maxdepth 2 -name 'DocBlocks.app' | head -n1)
          if [ -z "$APP" ]; then echo "No DocBlocks.app produced to verify"; exit 1; fi
          echo "Verifying code signature on $APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "Verifying notarization staple:"
          xcrun stapler validate "$APP"

      - name: Clean up keychain
        if: always()
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-artifacts
          path: |
            packages/desktop/dist/artifacts/*.dmg
            packages/desktop/dist/artifacts/*.dmg.blockmap
            packages/desktop/dist/artifacts/*.zip
            packages/desktop/dist/artifacts/*.zip.blockmap
            packages/desktop/dist/artifacts/latest-mac.yml
          retention-days: 14

  # ──────────────────────────────────────────────────────────────────────────
  # Linux — Build (no signing)
  # ──────────────────────────────────────────────────────────────────────────
  build-linux:
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build upstream packages
        run: npm run build

      - name: Build + package desktop (Linux)
        # Keep the architectures in separate processes. electron-builder's npm
        # dependency collector can read incomplete JSON while multi-arch package
        # tasks overlap in one process.
        working-directory: packages/desktop
        run: |
          npm run package:linux:x64 -- --publish never
          npm run package:linux:arm64 -- --publish never

      - name: Verify Linux architecture artifacts
        shell: bash
        run: |
          require_artifact() {
            if ! compgen -G "$1" > /dev/null; then
              echo "Missing Linux release artifact: $1" >&2
              exit 1
            fi
          }
          require_artifact 'packages/desktop/dist/artifacts/*-linux-x86_64.AppImage'
          require_artifact 'packages/desktop/dist/artifacts/*-linux-arm64.AppImage'
          require_artifact 'packages/desktop/dist/artifacts/*-linux-amd64.deb'
          require_artifact 'packages/desktop/dist/artifacts/*-linux-arm64.deb'
          require_artifact 'packages/desktop/dist/artifacts/latest-linux.yml'
          require_artifact 'packages/desktop/dist/artifacts/latest-linux-arm64.yml'

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-artifacts
          path: |
            packages/desktop/dist/artifacts/*.AppImage
            packages/desktop/dist/artifacts/*.deb
            packages/desktop/dist/artifacts/latest-linux.yml
            packages/desktop/dist/artifacts/latest-linux-arm64.yml
          retention-days: 14

  # ──────────────────────────────────────────────────────────────────────────
  # VS Code — Build VSIX package
  # ──────────────────────────────────────────────────────────────────────────
  build-vscode-vsix:
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build upstream packages
        run: npm run build:core && npm run build:react

      - name: Read release version
        id: version
        shell: bash
        run: |
          version="$(node --print "require('./packages/desktop/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Package VS Code extension
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: npm run package:vsix -w docblocks-vscode -- "$RELEASE_VERSION" --no-update-package-json

      - name: Upload VS Code artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vscode-artifacts
          path: packages/vscode/*.vsix
          retention-days: 14

  # ──────────────────────────────────────────────────────────────────────────
  # Release — Collect all artifacts and create GitHub Release
  # ──────────────────────────────────────────────────────────────────────────
  release:
    needs: [build-windows, build-macos, build-linux, build-vscode-vsix]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Verify tag matches desktop package version
        if: github.ref_type == 'tag'
        env:
          EXPECTED_TAG: desktop-v${{ needs.build-windows.outputs.version }}
        run: |
          if [ "${{ github.ref_name }}" != "$EXPECTED_TAG" ]; then
            echo "Release tag ${{ github.ref_name }} does not match package version $EXPECTED_TAG" >&2
            exit 1
          fi

      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          find windows-artifacts macos-artifacts linux-artifacts vscode-artifacts -type f \
            \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.vsix' \) \
            -print0 | while IFS= read -r -d '' f; do
              printf '%s  %s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$(basename "$f")"
            done | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('desktop-v{0}', needs.build-windows.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: DocBlocks Desktop v${{ needs.build-windows.outputs.version }}
          draft: ${{ inputs.draft || false }}
          generate_release_notes: true
          files: |
            artifacts/windows-artifacts/*
            artifacts/macos-artifacts/*
            artifacts/linux-artifacts/*
            artifacts/vscode-artifacts/*
            artifacts/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
