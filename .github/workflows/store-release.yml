##
# App Store Release Workflow
#
# Builds every store-submission package of DocBlocks:
#   - Windows: x64 and arm64 MSIX/APPX for the Microsoft Store (Partner Center)
#   - macOS:   signed .pkg for the Mac App Store (App Store Connect)
#   - Android: .aab signed with the upload key, for Google Play (Play Console)
#   - iOS:     App Store .ipa plus dSYMs, for App Store Connect
#   - VS Code: .vsix for the Visual Studio Marketplace
#
# These are DIFFERENT from the public installers built by desktop-release.yml
# and the unsigned review packages built by mobile-native.yml:
#   - Desktop auto-update is disabled at runtime (process.windowsStore /
#     process.mas); the stores deliver updates.
#   - They are attached only to an unpublished draft GitHub Release. Do not use
#     workflow artifacts here: in a public repository those are directly
#     downloadable from the workflow run. Maintainers download the private
#     draft assets for each store, then delete the draft when it is no longer
#     needed.
#   - With `publish: testing` (the default), separate upload jobs send the Mac
#     App Store and iOS builds to TestFlight, the Android bundle to Play
#     internal testing, and the Windows packages to a Microsoft Store package
#     flight, reading them back from the draft. None of those reach the public
#     or App Review from CI; the flight is certified but goes only to its tester
#     group. The upload jobs hold the store credentials, so the build jobs' npm,
#     Gradle, CocoaPods and electron-builder code never sees them, and a failed
#     upload can be retried with "Re-run failed jobs" without rebuilding: a
#     rerun keeps preflight's draft tag and build number.
#   - CI must never touch the public Microsoft Store listing. Every submission
#     API update there resends the price, which the API cannot read back for a
#     price set in Partner Center, and an empty price makes the paid app free
#     without an error. Flight submissions carry no price. To release a build,
#     start an update in Partner Center and, on its Packages page, copy the
#     packages from the flight.
#   - The VS Code extension is the exception: the Visual Studio Marketplace
#     has no testing track, so publishing it reaches everyone. It is therefore
#     not covered by `publish`; it uploads only when the separate
#     `publish_vscode` input is checked (off by default), and otherwise the
#     VSIX is just attached to the draft.
#     Its version is the desktop version, the stamp desktop-release.yml puts
#     on the VSIX it attaches to the public release. The Marketplace accepts
#     each version once, so until Release & Deploy bumps the desktop version a
#     rerun skips the Marketplace (--skip-duplicate) rather than failing.
#   - Versions are NOT stamped with a -build.N prerelease suffix; stores require
#     a clean x.y.z version, which comes from packages/desktop/package.json for
#     the Mac App Store build and packages/mobile/package.json for mobile. Both
#     stay the same across store builds until Release & Deploy bumps them, so
#     the build number cannot come from them: App Store Connect and Play reject
#     a number they have already seen. It is this workflow's run number, which
#     only rises, and it becomes the macOS and iOS CFBundleVersion and the
#     Android versionCode. The optional `build_number` input overrides it when a
#     store already holds something higher. A rerun of a run keeps its number.
#     The Microsoft Store reserves the MSIX version's fourth field, so
#     resubmitting there needs a new desktop version. Never export BUILD_NUMBER
#     in a desktop job: electron-builder appends it to the bundle version
#     (2.7.8.42), which App Store Connect rejects.
#   - Every package is verified before it is attached: desktop packages by
#     packages/desktop/scripts/check-store-packages.ts, mobile ones by
#     mobile:store.
#
# Prerequisites (one-time setup):
#   Microsoft Store:  reserve the app in Partner Center, fill the appx: identity
#                     values in electron-builder.yml. No signing cert needed
#                     (the Store re-signs). The first submission is by hand.
#   Mac App Store:    "Apple Distribution" + "Mac Installer Distribution" certs
#                     and a Mac App Store provisioning profile for
#                     com.bendyline.docblocks. Secrets:
#                     APPLE_MAS_CERTIFICATE_P12_BASE64,
#                     APPLE_MAS_CERTIFICATE_PASSWORD,
#                     MAS_PROVISIONING_PROFILE_BASE64, APPLE_TEAM_ID.
#   Google Play:      a Play Console app for com.bendyline.docblocks
#                     enrolled in Play App Signing; Google re-signs with the
#                     app signing key. Secrets: ANDROID_UPLOAD_KEYSTORE_BASE64,
#                     ANDROID_UPLOAD_KEYSTORE_PASSWORD, ANDROID_UPLOAD_KEY_ALIAS,
#                     ANDROID_UPLOAD_KEY_PASSWORD.
#   App Store (iOS):  an "Apple Distribution" .p12 (the identity is shared with
#                     macOS) and an App Store Connect provisioning profile for
#                     com.bendyline.docblocks that authorizes it (one bundle ID
#                     with the Mac build, for universal purchase).
#                     Secrets: IOS_DISTRIBUTION_CERTIFICATE_BASE64,
#                     IOS_DISTRIBUTION_CERTIFICATE_PASSWORD,
#                     IOS_PROVISIONING_PROFILE_BASE64.
#   Store uploads (publish: testing, or publish_vscode for the Marketplace):
#     App Store Connect: a Team Key with App Manager access, which covers macOS
#                     and iOS. Secrets: APP_STORE_CONNECT_API_KEY_ID (10
#                     characters), APP_STORE_CONNECT_API_ISSUER_ID (UUID),
#                     APP_STORE_CONNECT_API_KEY_BASE64 (the .p8 file). The
#                     com.bendyline.docblocks app record must list both
#                     platforms.
#     Google Play:    a service account with "Release apps to testing tracks"
#                     on the DocBlocks app. Secret:
#                     GOOGLE_PLAY_SERVICE_ACCOUNT_JSON (the JSON key file as
#                     plain text, not base64). Play's API cannot create the
#                     first release: upload the first .aab to Internal testing
#                     by hand.
#     Microsoft Store: a Microsoft Entra app in the tenant linked to Partner
#                     Center, with the Manager role there and a federated
#                     credential for the subject
#                     repo:bendyline/docblocks:environment:microsoft-store, so
#                     no key is stored. The GitHub environment microsoft-store
#                     allows only main. Secrets: MS_STORE_TENANT_ID and
#                     MS_STORE_CLIENT_ID (the app's GUIDs), and
#                     MS_STORE_FLIGHT_GROUP_ID (a Partner Center known user
#                     group). upload-msix creates the flight itself: the API
#                     cannot fill a flight made in Partner Center.
#     VS Code Marketplace: a publisher whose ID matches "publisher" in
#                     packages/vscode/package.json, with a Trusted Publishing
#                     policy for this repository's owner and name, workflow
#                     store-release.yml, and no environment. No secret: the
#                     upload job trades its GitHub OIDC token for a 15-minute
#                     Marketplace credential.
#   Store each file secret as single-line base64 (`base64 -i FILE`) unless
#   noted otherwise.
##

name: Release Store Builds

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which store build(s) to produce'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - desktop
          - mobile
          - windows
          - macos
          - android
          - ios
          - vscode
      build_number:
        description: 'Optional override. Leave blank to use this run number; set it only if a store already holds a higher build.'
        required: false
        type: string
      publish:
        description: 'testing: also send macOS and iOS to TestFlight, Android to Play internal testing, and Windows to a Microsoft Store flight. VS Code has its own switch below.'
        required: true
        default: 'testing'
        type: choice
        options:
          - testing
          - none
      publish_vscode:
        description: 'Also publish the VS Code extension to the Marketplace. This is public: the Marketplace has no testing track. Off: the VSIX is only attached to the draft.'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  FASTLANE_VERSION: '2.241.1'
  RUBY_VERSION: '3.4'

jobs:
  # Fails in seconds, rather than after the quality gate, when a requested
  # build lacks its signing or upload secrets, or the build number override is
  # invalid.
  preflight:
    name: Check Inputs and Secrets
    runs-on: ubuntu-24.04
    outputs:
      windows: ${{ steps.targets.outputs.windows }}
      macos: ${{ steps.targets.outputs.macos }}
      android: ${{ steps.targets.outputs.android }}
      ios: ${{ steps.targets.outputs.ios }}
      vscode: ${{ steps.targets.outputs.vscode }}
      build_number: ${{ steps.targets.outputs.build_number }}
      publish: ${{ steps.targets.outputs.publish }}
      publish_vscode: ${{ steps.targets.outputs.publish_vscode }}
      # Every job attaches to, or reads from, this one draft. "Re-run failed
      # jobs" keeps a successful preflight's outputs, so a rerun builder or
      # uploader finds the draft the first attempt created; "Re-run all jobs"
      # starts a new draft.
      draft_tag: ${{ steps.targets.outputs.draft_tag }}

    steps:
      - name: Resolve targets and check secrets
        id: targets
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          PUBLISH: ${{ inputs.publish }}
          PUBLISH_VSCODE: ${{ inputs.publish_vscode }}
          BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
          APPLE_MAS_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_MAS_CERTIFICATE_P12_BASE64 }}
          MAS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MAS_PROVISIONING_PROFILE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          MS_STORE_TENANT_ID: ${{ secrets.MS_STORE_TENANT_ID }}
          MS_STORE_CLIENT_ID: ${{ secrets.MS_STORE_CLIENT_ID }}
          MS_STORE_FLIGHT_GROUP_ID: ${{ secrets.MS_STORE_FLIGHT_GROUP_ID }}
        run: |
          case "$TARGET" in
            all) targets='windows macos android ios vscode' ;;
            desktop) targets='windows macos' ;;
            mobile) targets='android ios' ;;
            *) targets="$TARGET" ;;
          esac
          required=()
          app_store_upload=false
          play_upload=false
          microsoft_store_upload=false
          # vscode needs no secret: its upload job uses Marketplace Trusted
          # Publishing (OIDC).
          for target in windows macos android ios vscode; do
            selected=false
            [[ " $targets " == *" $target "* ]] && selected=true
            echo "$target=$selected" >> "$GITHUB_OUTPUT"
            [ "$selected" = true ] || continue
            case "$target" in
              macos) required+=(APPLE_MAS_CERTIFICATE_P12_BASE64 MAS_PROVISIONING_PROFILE_BASE64) ;;
              android) required+=(ANDROID_UPLOAD_KEYSTORE_BASE64 ANDROID_UPLOAD_KEYSTORE_PASSWORD ANDROID_UPLOAD_KEY_ALIAS ANDROID_UPLOAD_KEY_PASSWORD) ;;
              ios) required+=(IOS_DISTRIBUTION_CERTIFICATE_BASE64 IOS_DISTRIBUTION_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64) ;;
            esac
            if [ "$PUBLISH" = testing ]; then
              case "$target" in
                macos|ios) app_store_upload=true ;;
                android) play_upload=true ;;
                windows) microsoft_store_upload=true ;;
              esac
            fi
          done
          if [ "$app_store_upload" = true ]; then
            required+=(APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_API_ISSUER_ID APP_STORE_CONNECT_API_KEY_BASE64)
          fi
          if [ "$play_upload" = true ]; then
            required+=(GOOGLE_PLAY_SERVICE_ACCOUNT_JSON)
          fi
          if [ "$microsoft_store_upload" = true ]; then
            required+=(MS_STORE_TENANT_ID MS_STORE_CLIENT_ID MS_STORE_FLIGHT_GROUP_ID)
          fi
          status=0
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required for the requested store build"
              status=1
            fi
          done
          # Catch a pasted wrong file now rather than after an hour of building.
          # Messages name a secret, never its value.
          if [ "$app_store_upload" = true ]; then
            if [ -n "$APP_STORE_CONNECT_API_KEY_ID" ] && ! [[ "$APP_STORE_CONNECT_API_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]; then
              echo "::error::APP_STORE_CONNECT_API_KEY_ID must be the key's 10-character Key ID"
              status=1
            fi
            if [ -n "$APP_STORE_CONNECT_API_ISSUER_ID" ] && ! [[ "$APP_STORE_CONNECT_API_ISSUER_ID" =~ ^[0-9a-fA-F-]{36}$ ]]; then
              echo "::error::APP_STORE_CONNECT_API_ISSUER_ID must be the Issuer ID, a UUID"
              status=1
            fi
            if [ -n "$APP_STORE_CONNECT_API_KEY_BASE64" ] &&
              [ "$(printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | tr -d '[:space:]' | base64 --decode 2>/dev/null | head -c 27)" != '-----BEGIN PRIVATE KEY-----' ]; then
              echo "::error::APP_STORE_CONNECT_API_KEY_BASE64 must be the base64 of the downloaded .p8 file"
              status=1
            fi
          fi
          if [ "$play_upload" = true ] && [ -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ] &&
            ! python3 -c 'import json, os; a = json.loads(os.environ["GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"]); assert isinstance(a, dict) and a.get("client_email") and a.get("private_key")' 2>/dev/null; then
            echo "::error::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON must be the service account's JSON key file, as plain text"
            status=1
          fi
          if [ "$microsoft_store_upload" = true ]; then
            guid='^[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}$'
            for name in MS_STORE_TENANT_ID MS_STORE_CLIENT_ID; do
              if [ -n "${!name}" ] && ! [[ "${!name}" =~ $guid ]]; then
                echo "::error::$name must be the GUID from the Entra app's Overview page"
                status=1
              fi
            done
            if [ -n "$MS_STORE_FLIGHT_GROUP_ID" ] && ! [[ "$MS_STORE_FLIGHT_GROUP_ID" =~ ^[0-9a-zA-Z-]+$ ]]; then
              echo "::error::MS_STORE_FLIGHT_GROUP_ID must be the known user group's ID, not its name or address"
              status=1
            fi
            # The microsoft-store environment would refuse the upload job anyway,
            # an hour from now.
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::The Microsoft Store upload runs only from main. Run this from main, choose publish: none, or choose a target without Windows"
              status=1
            fi
          fi
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          # The Marketplace upload is opt-in and independent of `publish`: it
          # runs only when the VSIX is built and publish_vscode is checked.
          publish_vscode=false
          if [[ " $targets " == *" vscode "* ]] && [ "$PUBLISH_VSCODE" = true ]; then
            publish_vscode=true
          fi
          echo "publish_vscode=$publish_vscode" >> "$GITHUB_OUTPUT"
          echo "draft_tag=store-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          if [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]{0,8}$ ]]; then
            echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          else
            echo "::error::build_number must be blank, or a positive integer of at most 9 digits higher than every build already uploaded to that store"
            status=1
          fi
          exit "$status"

  quality:
    name: Canonical Quality Gate
    needs: preflight
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Setup governed npm
        uses: ./.github/actions/setup-npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright runtime
        run: |
          npx playwright install --with-deps chromium firefox webkit
          npm exec -w @bendyline/docblocks-cli -- playwright-core install chromium

      # `npm run all` runs mobile:test:available, which builds with Gradle here.
      - name: Use Google's Maven Central mirror
        uses: ./.github/actions/maven-central-mirror

      - name: Run canonical quality gate
        run: xvfb-run -a npm run all

  create-draft-release:
    name: Create Private Draft Release
    needs: [preflight, quality]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Read desktop and mobile versions
        id: versions
        shell: bash
        run: |
          desktop="$(node --print "require('./packages/desktop/package.json').version")"
          mobile="$(node --print "require('./packages/mobile/package.json').version")"
          echo "desktop=$desktop" >> "$GITHUB_OUTPUT"
          echo "mobile=$mobile" >> "$GITHUB_OUTPUT"
          if [ "$desktop" = "$mobile" ]; then
            echo "label=v$desktop" >> "$GITHUB_OUTPUT"
          else
            echo "label=desktop v$desktop / mobile v$mobile" >> "$GITHUB_OUTPUT"
          fi

      # A unique, previously unpublished tag per run attempt (see preflight's
      # draft_tag). GitHub does not publish the release or its tag while the
      # release remains a draft.
      - name: Create unpublished store-build draft
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.preflight.outputs.draft_tag }}
          target_commitish: ${{ github.sha }}
          name: KEEP IN DRAFT ONLY - DocBlocks Store Build ${{ steps.versions.outputs.label }} (run ${{ github.run_number }})
          body: |
            Private store-submission build for DocBlocks ${{ steps.versions.outputs.label }}.

            - Target: `${{ inputs.target }}`
            - Desktop version: `${{ steps.versions.outputs.desktop }}`
            - Mobile version: `${{ steps.versions.outputs.mobile }}`
            - Build number (Mac App Store, App Store, Google Play): `${{ needs.preflight.outputs.build_number }}`
            - Sent to testers (TestFlight, Play internal testing, Microsoft Store flight): `${{ needs.preflight.outputs.publish }}`
            - VS Code extension version (the desktop version): `${{ steps.versions.outputs.desktop }}`
            - VS Code published to the Marketplace: `${{ needs.preflight.outputs.publish_vscode }}`
            - Source commit: `${{ github.sha }}`
            - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            The store packages are attached only to this unpublished draft. Publishing
            the release would make it and its assets public; delete the draft after the
            packages have been submitted to the stores.
          draft: true
          prerelease: false
          make_latest: false

  # ──────────────────────────────────────────────────────────────────────────
  # Windows — Microsoft Store MSIX for x64 and arm64 (unsigned; the Store
  # re-signs on ingestion). Submit both packages in the same submission.
  # ──────────────────────────────────────────────────────────────────────────
  build-msix:
    needs: [preflight, quality, create-draft-release]
    if: ${{ needs.preflight.outputs.windows == 'true' }}
    runs-on: windows-2025-vs2026
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Setup governed npm
        uses: ./.github/actions/setup-npm

      - name: Install dependencies
        run: npm ci

      # NB: no version stamping — the Store wants a clean x.y.z version.

      - name: Build upstream packages
        run: npm run build

      # Invoke electron-builder directly — on Windows, npm/cmd swallows the
      # `--publish` flag when forwarded through `npm run … -- --publish never`.
      # Without an architecture flag electron-builder packages only the runner's
      # own (x64), so ARM64 Windows would run x64 Gezel engines under emulation.
      # One process per architecture, as for the Linux packages. pwsh does not
      # stop on a failing native command, so check each exit code.
      - name: Build MSIX packages
        working-directory: packages/desktop
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($arch in @('x64', 'arm64')) {
            npx --no-install electron-builder --win appx "--$arch" --publish never
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
        env:
          # Release artifacts must carry the app-local Visual C++ runtime.
          DOCBLOCKS_VCRUNTIME_REQUIRED: '1'

      # Partner Center matches each package's identity against the app
      # reservation; check both architectures before they leave the runner.
      - name: Verify Microsoft Store packages
        working-directory: packages/desktop
        run: npx --no-install tsx scripts/check-store-packages.ts msix

      - name: Attach MSIX to private draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.preflight.outputs.draft_tag }}
          draft: true
          files: packages/desktop/dist/artifacts/*.{appx,msix}
          fail_on_unmatched_files: true

  # ──────────────────────────────────────────────────────────────────────────
  # macOS — Mac App Store .pkg (sandboxed; signed with MAS distribution certs)
  # ──────────────────────────────────────────────────────────────────────────
  build-mas:
    needs: [preflight, quality, create-draft-release]
    if: ${{ needs.preflight.outputs.macos == 'true' }}
    # Pin the signing image to match desktop-release.yml's Developer ID build.
    # `macos-latest` moved from macOS 15 to macOS 26, where codesign changed
    # behavior; keep Mac App Store signing on the same known-good image.
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Setup governed npm
        uses: ./.github/actions/setup-npm

      - name: Install dependencies
        run: npm ci

      # NB: no version stamping — the App Store wants a clean x.y.z version.

      - name: Build upstream packages
        run: npm run build

      - name: Import MAS certificates
        env:
          MAS_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_MAS_CERTIFICATE_P12_BASE64 }}
          MAS_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_MAS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MAS_CERTIFICATE_P12_BASE64" ]; then
            echo "::error::APPLE_MAS_CERTIFICATE_P12_BASE64 is required for a Mac App Store build"
            exit 1
          fi
          # The .p12 must contain BOTH "Apple Distribution" and
          # "Mac Installer Distribution" identities for the mas target.
          KEYCHAIN_PATH=$RUNNER_TEMP/mas-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$MAS_CERTIFICATE_P12_BASE64" | base64 --decode > $RUNNER_TEMP/mas-certificate.p12
          security import $RUNNER_TEMP/mas-certificate.p12 \
            -P "$MAS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain

      - name: Install provisioning profile
        env:
          MAS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MAS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -z "$MAS_PROVISIONING_PROFILE_BASE64" ]; then
            echo "::error::MAS_PROVISIONING_PROFILE_BASE64 is required for a Mac App Store build"
            exit 1
          fi
          echo "$MAS_PROVISIONING_PROFILE_BASE64" | base64 --decode > packages/desktop/embedded.provisionprofile

      # The build number becomes CFBundleVersion through mas.bundleVersion.
      # Never name it BUILD_NUMBER here: electron-builder appends that variable
      # to the version (2.7.8.42), which App Store Connect rejects.
      - name: Build MAS package
        run: |
          sudo launchctl limit maxfiles 524288 524288
          ulimit -n 524288
          npm run dist:mas -w docblocks-desktop -- --publish never "-c.mas.bundleVersion=$MAS_BUILD_NUMBER"
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          UV_THREADPOOL_SIZE: 16
          MAS_BUILD_NUMBER: ${{ needs.preflight.outputs.build_number }}

      # The installer and app signatures, entitlements, Info.plist and helper
      # set, plus the runtime verifier the shipped app runs over its engines.
      - name: Verify MAS package
        working-directory: packages/desktop
        run: npx --no-install tsx scripts/check-store-packages.ts mas "$MAS_BUILD_NUMBER"
        env:
          MAS_BUILD_NUMBER: ${{ needs.preflight.outputs.build_number }}

      - name: Clean up
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/mas-signing.keychain-db" 2>/dev/null || true
          rm -f packages/desktop/embedded.provisionprofile

      # electron-builder writes the MAS .pkg into the mas-<arch> subdirectory
      # (next to DocBlocks.app), not the artifacts root. List the tree so the
      # path stays visible in the log, then match the package recursively below.
      - name: List MAS build artifacts
        run: |
          find packages/desktop/dist/artifacts -maxdepth 2 -type d | sort
          find packages/desktop/dist/artifacts -name '*.pkg' | sort

      - name: Attach MAS package to private draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.preflight.outputs.draft_tag }}
          draft: true
          files: packages/desktop/dist/artifacts/**/*.pkg
          fail_on_unmatched_files: true

  # ──────────────────────────────────────────────────────────────────────────
  # Android — Google Play app bundle (signed with the upload key; Play App
  # Signing re-signs it with the app signing key for delivery)
  # ──────────────────────────────────────────────────────────────────────────
  build-aab:
    needs: [preflight, quality, create-draft-release]
    if: ${{ needs.preflight.outputs.android == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Setup governed npm
        uses: ./.github/actions/setup-npm

      - name: Install dependencies
        run: npm ci

      - name: Select installed JDK and Android toolchain
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          # Hosted images install the command-line tools without adding them to PATH.
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'

      - name: Use Google's Maven Central mirror
        uses: ./.github/actions/maven-central-mirror

      # The Linux quality gate already ran the Android storage contract through
      # mobile:test:available. mobile:store rebuilds, checks, and syncs the web
      # payload, signs the bundle, verifies the upload-key signature with
      # jarsigner, and compares every bundled web file against the Vite output.
      - name: Build signed app bundle
        env:
          BUILD_NUMBER: ${{ needs.preflight.outputs.build_number }}
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: npm run mobile:store -- android "$BUILD_NUMBER"

      - name: Attach app bundle to private draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.preflight.outputs.draft_tag }}
          draft: true
          files: reports/mobile-store/*/docblocks-android-*
          fail_on_unmatched_files: true

  # ──────────────────────────────────────────────────────────────────────────
  # iOS — App Store Connect IPA (manually signed with an Apple Distribution
  # identity and an App Store provisioning profile; nothing is uploaded)
  # ──────────────────────────────────────────────────────────────────────────
  build-ipa:
    needs: [preflight, quality, create-draft-release]
    if: ${{ needs.preflight.outputs.ios == 'true' }}
    # The Gezel system-provider adapters require Xcode 27, matching mobile-native.yml.
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Setup governed npm
        uses: ./.github/actions/setup-npm

      - name: Install dependencies
        run: npm ci

      # npm run all runs on Linux, so it cannot run the Swift storage suite.
      # Qualify this exact commit before signing it.
      - name: Run iOS native tests
        run: npm run mobile:test:ios

      # The script restores the Xcode project, keychain search list, and
      # provisioning profiles, and deletes its temporary keychain, whether or
      # not the build succeeds.
      - name: Archive and export App Store IPA
        env:
          # Vite's mobile bundle exceeds the Xcode runner's default 2 GiB Node heap.
          NODE_OPTIONS: --max-old-space-size=4096
          BUILD_NUMBER: ${{ needs.preflight.outputs.build_number }}
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: npm run mobile:store -- ios "$BUILD_NUMBER"

      - name: Attach IPA and symbols to private draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.preflight.outputs.draft_tag }}
          draft: true
          files: reports/mobile-store/*/docblocks-ios-*
          fail_on_unmatched_files: true

  # ──────────────────────────────────────────────────────────────────────────
  # VS Code — Visual Studio Marketplace VSIX, stamped with the desktop version
  # exactly as desktop-release.yml stamps the VSIX on the public release
  # ──────────────────────────────────────────────────────────────────────────
  build-vsix:
    needs: [preflight, quality, create-draft-release]
    if: ${{ needs.preflight.outputs.vscode == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Setup governed npm
        uses: ./.github/actions/setup-npm

      - name: Install dependencies
        run: npm ci

      - name: Build upstream packages
        run: npm run build:core && npm run build:react

      - name: Read release version
        id: version
        shell: bash
        run: |
          version="$(node --print "require('./packages/desktop/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Package VS Code extension
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: npm run package:vsix -w docblocks-vscode -- "$RELEASE_VERSION" --no-update-package-json

      # The Trusted Publishing policy belongs to one publisher, and the
      # Marketplace takes each version once: check both in the packed manifest.
      - name: Verify VSIX identity and version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          unzip -p "packages/vscode/docblocks-vscode-$RELEASE_VERSION.vsix" extension/package.json \
            > "$RUNNER_TEMP/vsix-package.json"
          node -e '
            const packed = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            const source = require("./packages/vscode/package.json");
            const expected = { publisher: source.publisher, name: source.name, version: process.env.RELEASE_VERSION };
            for (const [key, value] of Object.entries(expected)) {
              if (packed[key] !== value) {
                console.error(`::error::The VSIX ${key} is ${packed[key]}, expected ${value}`);
                process.exit(1);
              }
            }
            console.log(`VSIX: ${packed.publisher}.${packed.name} ${packed.version}`);
          ' "$RUNNER_TEMP/vsix-package.json"

      - name: Attach VSIX to private draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.preflight.outputs.draft_tag }}
          draft: true
          files: packages/vscode/docblocks-vscode-${{ steps.version.outputs.version }}.vsix
          fail_on_unmatched_files: true

  # ──────────────────────────────────────────────────────────────────────────
  # Store uploads (publish: testing; upload-vsix only with publish_vscode).
  # Each reads its verified package back from the private draft, so the store
  # credentials never meet the build jobs, and "Re-run failed jobs" retries an
  # upload without rebuilding. Nothing here reaches the public: TestFlight
  # builds go to testers once Apple has processed them, Play internal testing is
  # limited to its tester list, and the Microsoft Store flight to its user group
  # once Microsoft has certified it. The VS Code Marketplace is the exception
  # (see the header), which is why it is a separate opt-in.
  #
  # contents: write is needed only because GitHub lists draft releases to
  # tokens with push access. The token is passed to the download step alone.
  # Only upload-vsix checks out, without persisting the token, so later steps
  # cannot use it.
  # ──────────────────────────────────────────────────────────────────────────
  upload-mas:
    name: Upload Mac App Store Build to TestFlight
    needs: [preflight, build-mas]
    if: ${{ needs.preflight.outputs.publish == 'testing' }}
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Download MAS package from private draft
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_TAG: ${{ needs.preflight.outputs.draft_tag }}
        run: |
          gh release download "$DRAFT_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.pkg' --dir "$RUNNER_TEMP/store"
          shopt -s nullglob
          files=("$RUNNER_TEMP"/store/*.pkg)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::Expected one .pkg on $DRAFT_TAG, found ${#files[@]}"
            exit 1
          fi
          echo "file=${files[0]}" >> "$GITHUB_OUTPUT"

      # altool reads AuthKey_<id>.p8 from API_PRIVATE_KEYS_DIR. It returns when
      # Apple accepts the upload, before processing ends; Apple emails any
      # processing problem, so a green job does not prove testers have it.
      - name: Upload to TestFlight
        env:
          API_PRIVATE_KEYS_DIR: ${{ runner.temp }}/app-store-connect
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          PACKAGE: ${{ steps.download.outputs.file }}
        run: |
          mkdir -p -m 700 "$API_PRIVATE_KEYS_DIR"
          (umask 077; printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | tr -d '[:space:]' | base64 --decode \
            > "$API_PRIVATE_KEYS_DIR/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8")
          xcrun altool --upload-app -f "$PACKAGE" -t macos \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"
          echo "Uploaded \`$(basename "$PACKAGE")\` to **TestFlight (macOS)**. Apple emails any processing errors." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary key
        if: always()
        run: rm -rf "$RUNNER_TEMP/app-store-connect"

  upload-aab:
    name: Upload Android Bundle to Play Internal Testing
    needs: [preflight, build-aab]
    if: ${{ needs.preflight.outputs.publish == 'testing' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Download app bundle from private draft
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_TAG: ${{ needs.preflight.outputs.draft_tag }}
        run: |
          gh release download "$DRAFT_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'docblocks-android-*.aab' --dir "$RUNNER_TEMP/store"
          shopt -s nullglob
          files=("$RUNNER_TEMP"/store/*.aab)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::Expected one .aab on $DRAFT_TAG, found ${#files[@]}"
            exit 1
          fi
          echo "file=${files[0]}" >> "$GITHUB_OUTPUT"

      - name: Setup Ruby
        uses: ruby/setup-ruby@e1bd6146574da5e0795075b5319b300edb30c5b0 # v1.333.0
        with:
          ruby-version: ${{ env.RUBY_VERSION }}

      - name: Install fastlane
        run: gem install fastlane --version "$FASTLANE_VERSION" --no-document

      # fastlane's resumable upload retries in chunks, and --timeout also covers
      # Play's processing before it responds. Play's API cannot make an app's
      # first release: until one is rolled out to Internal testing by hand, this
      # fails with "Package not found" or "Only releases with status draft may
      # be created on draft app".
      - name: Upload to Play internal testing
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          FASTLANE_OPT_OUT_USAGE: '1'
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          BUNDLE: ${{ steps.download.outputs.file }}
        run: |
          fastlane supply \
            --package_name com.bendyline.docblocks \
            --aab "$BUNDLE" \
            --track internal \
            --timeout 1800 \
            --skip_upload_apk true \
            --skip_upload_metadata true \
            --skip_upload_changelogs true \
            --skip_upload_images true \
            --skip_upload_screenshots true
          echo "Uploaded \`$(basename "$BUNDLE")\` to **Play internal testing**." >> "$GITHUB_STEP_SUMMARY"

  upload-ipa:
    name: Upload iOS Build to TestFlight
    needs: [preflight, build-ipa]
    if: ${{ needs.preflight.outputs.publish == 'testing' }}
    # Uploading needs only altool, so the standard image serves; the IPA was
    # built and signed on the Xcode 27 runner.
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Download IPA from private draft
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_TAG: ${{ needs.preflight.outputs.draft_tag }}
        run: |
          gh release download "$DRAFT_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'docblocks-ios-*.ipa' --dir "$RUNNER_TEMP/store"
          shopt -s nullglob
          files=("$RUNNER_TEMP"/store/*.ipa)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::Expected one .ipa on $DRAFT_TAG, found ${#files[@]}"
            exit 1
          fi
          echo "file=${files[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload to TestFlight
        env:
          API_PRIVATE_KEYS_DIR: ${{ runner.temp }}/app-store-connect
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          PACKAGE: ${{ steps.download.outputs.file }}
        run: |
          mkdir -p -m 700 "$API_PRIVATE_KEYS_DIR"
          (umask 077; printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | tr -d '[:space:]' | base64 --decode \
            > "$API_PRIVATE_KEYS_DIR/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8")
          xcrun altool --upload-app -f "$PACKAGE" -t ios \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"
          echo "Uploaded \`$(basename "$PACKAGE")\` to **TestFlight (iOS)**. Apple emails any processing errors." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary key
        if: always()
        run: rm -rf "$RUNNER_TEMP/app-store-connect"

  # Entra trades this job's GitHub OIDC token for a one-hour Store token, so no
  # key is stored anywhere. Only this job and upload-vsix may request an OIDC
  # token. It calls the submission API directly because Microsoft's msstore CLI
  # publishes a single package and does not take .appx. Every call stays under
  # the flight (see the header): check-assurance-contract.ts enforces that.
  upload-msix:
    name: Submit Windows Packages to the Microsoft Store Flight
    needs: [preflight, build-msix]
    if: ${{ needs.preflight.outputs.publish == 'testing' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: microsoft-store
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Download Windows packages from private draft
        id: download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_TAG: ${{ needs.preflight.outputs.draft_tag }}
        run: |
          gh release download "$DRAFT_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*-win-*' --dir "$RUNNER_TEMP/store"
          cd "$RUNNER_TEMP/store"
          shopt -s nullglob
          packages=()
          version=
          for arch in x64 arm64; do
            files=(*-win-"$arch".appx *-win-"$arch".msix)
            if [ "${#files[@]}" -ne 1 ]; then
              echo "::error::Expected one $arch package on $DRAFT_TAG, found ${#files[@]}"
              exit 1
            fi
            # The Store reports the manifest's version, so compare against that.
            identity="$(unzip -p "${files[0]}" AppxManifest.xml | tr '\r\n' '  ' | grep -o '<Identity [^>]*>')"
            package_version="$(sed -n 's/.* Version="\([0-9.]*\)".*/\1/p' <<< "$identity")"
            if [ -z "$package_version" ] || [ "$package_version" != "${version:-$package_version}" ] ||
              [[ "$identity" != *" ProcessorArchitecture=\"$arch\""* ]]; then
              echo "::error::${files[0]} has an unexpected identity: $identity"
              exit 1
            fi
            version="$package_version"
            packages+=("${files[0]}")
            echo "$arch=${files[0]}" >> "$GITHUB_OUTPUT"
          done
          # The packages are already compressed; the API takes them in one ZIP.
          zip -q -0 packages.zip "${packages[@]}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Stops after Microsoft accepts the packages: certification takes hours to
      # days and reports by email and in Partner Center.
      - name: Submit to the package flight
        shell: bash
        env:
          STORE_ID: 9MTLPD213DL0
          FLIGHT_NAME: DocBlocks CI
          MS_STORE_TENANT_ID: ${{ secrets.MS_STORE_TENANT_ID }}
          MS_STORE_CLIENT_ID: ${{ secrets.MS_STORE_CLIENT_ID }}
          MS_STORE_FLIGHT_GROUP_ID: ${{ secrets.MS_STORE_FLIGHT_GROUP_ID }}
          VERSION: ${{ steps.download.outputs.version }}
          X64_PACKAGE: ${{ steps.download.outputs.x64 }}
          ARM64_PACKAGE: ${{ steps.download.outputs.arm64 }}
          NOTES: DocBlocks opens with a Welcome document and needs no sign-in. AI assistance, dictation and read aloud are optional, off by default, and download their models only when chosen in Settings.
        run: |
          app="https://manage.devcenter.microsoft.com/v1.0/my/applications/$STORE_ID"
          umask 077
          work="$(mktemp -d "$RUNNER_TEMP/microsoft-store.XXXXXX")"
          trap 'rm -rf "$work"' EXIT

          # The subject claim must match the Entra app's federated credential.
          assertion="$(curl -sS --fail --retry 3 -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api%3A%2F%2FAzureADTokenExchange" | jq -er .value)"
          echo "::add-mask::$assertion"
          sign_in="$(printf '%s' "$assertion" | curl -sS --retry 3 \
            "https://login.microsoftonline.com/$MS_STORE_TENANT_ID/oauth2/v2.0/token" \
            --data-urlencode grant_type=client_credentials \
            --data-urlencode "client_id=$MS_STORE_CLIENT_ID" \
            --data-urlencode scope=https://manage.devcenter.microsoft.com/.default \
            --data-urlencode client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer \
            --data-urlencode client_assertion@-)"
          token="$(jq -r '.access_token // empty' <<< "$sign_in")"
          if [ -z "$token" ]; then
            echo "::error::Microsoft Entra refused the sign-in: $(jq -r '.error_description // .error // "no reason given"' <<< "$sign_in" | tr -d '\r' | head -n 1)"
            exit 1
          fi
          echo "::add-mask::$token"
          printf 'Authorization: Bearer %s\n' "$token" > "$work/authorization"

          # api METHOD PATH [BODY_FILE] prints the response. Only requests that are
          # safe to repeat are retried.
          api() {
            local method="$1" path="$2" body="${3:-}" status
            local args=(-sS --connect-timeout 30 --max-time 300 -X "$method" -o "$work/response"
              -w '%{http_code}' -H "@$work/authorization" -H 'Accept: application/json')
            case "$method" in
              GET|PUT) args+=(--retry 5 --retry-delay 10) ;;
              POST) [ -n "$body" ] || args+=(-H 'Content-Type:' --data '') ;;
            esac
            [ -z "$body" ] || args+=(-H 'Content-Type: application/json' --data-binary "@$body")
            : > "$work/response"
            status="$(curl "${args[@]}" "$app/$path")" || return 1
            if [[ "$status" != 2?? ]]; then
              echo "::error::Microsoft Store: $method $path returned $status: $(head -c 2000 "$work/response" | tr '\r\n' '  ')" >&2
              return 1
            fi
            cat "$work/response"
          }

          # Sets flight_id, creating the flight when the app has none by this name.
          find_or_create_flight() {
            flight_id="$(api GET 'listflights?skip=0&top=100' |
              jq -r --arg name "$FLIGHT_NAME" 'first(.value[]? | select(.friendlyName == $name) | .flightId) // empty')"
            if [ -z "$flight_id" ]; then
              jq -n --arg name "$FLIGHT_NAME" --arg group "$MS_STORE_FLIGHT_GROUP_ID" \
                '{friendlyName: $name, groupIds: [$group], rankHigherThan: null}' > "$work/flight"
              flight_id="$(api POST flights "$work/flight" | jq -er .flightId)"
              echo "Created the package flight \"$FLIGHT_NAME\"."
            fi
          }

          # Whether the submission on stdin holds both of this build's packages.
          has_this_build() {
            jq -e --arg version "$VERSION" '
              [.flightPackages[]? | select(.fileStatus != "PendingDelete" and .version == $version)
                | (.architecture // "" | ascii_downcase)]
              | any(. == "x64") and any(. == "arm64")' > /dev/null
          }

          # Reports on the run's summary page.
          report() {
            echo "$1"
            echo "$1" >> "$GITHUB_STEP_SUMMARY"
          }

          find_or_create_flight
          flight="$(api GET "flights/$flight_id")"
          published_id="$(jq -r '.lastPublishedFlightSubmission.id // empty' <<< "$flight")"
          pending_id="$(jq -r '.pendingFlightSubmission.id // empty' <<< "$flight")"
          if [ -n "$published_id" ]; then
            submission="$(api GET "flights/$flight_id/submissions/$published_id")"
            if has_this_build <<< "$submission"; then
              report "\`$VERSION\` is already on the **Microsoft Store flight**; nothing was submitted."
              exit 0
            fi
          fi
          if [ -n "$pending_id" ]; then
            submission="$(api GET "flights/$flight_id/submissions/$pending_id")"
            status="$(jq -r '.status // "unknown"' <<< "$submission")"
            case "$status" in
              None|PendingCommit|Canceled|CommitFailed|PreProcessingFailed|CertificationFailed|ReleaseFailed|PublishFailed)
                echo "Replacing the flight's unfinished submission ($status)."
                api DELETE "flights/$flight_id/submissions/$pending_id"
                # Deleting a flight's only submission deletes the flight with it.
                find_or_create_flight
                ;;
              *)
                if has_this_build <<< "$submission"; then
                  report "\`$VERSION\` is already submitted to the **Microsoft Store flight** ($status)."
                  exit 0
                fi
                echo "::error::The flight's previous submission is still in progress ($status). Wait for it to publish or cancel it in Partner Center, then re-run this job."
                exit 1
                ;;
            esac
          fi

          submission="$(api POST "flights/$flight_id/submissions")"
          submission_id="$(jq -er .id <<< "$submission")"
          upload_url="$(jq -er .fileUploadUrl <<< "$submission")"
          echo "::add-mask::$upload_url"
          # A new submission copies the last one: replace every package it lists.
          jq --arg x64 "$X64_PACKAGE" --arg arm64 "$ARM64_PACKAGE" --arg notes "$NOTES" '{
            flightPackages: (
              [.flightPackages[]? | {id, fileName, fileStatus: "PendingDelete", minimumDirectXVersion, minimumSystemRam}]
              + [$x64, $arm64 | {fileName: ., fileStatus: "PendingUpload", minimumDirectXVersion: "None", minimumSystemRam: "None"}]
            ),
            packageDeliveryOptions,
            targetPublishMode: "Immediate",
            targetPublishDate,
            notesForCertification: (if (.notesForCertification // "") == "" then $notes else .notesForCertification end)
          }' <<< "$submission" > "$work/update"
          api PUT "flights/$flight_id/submissions/$submission_id" "$work/update" > /dev/null
          # The URL is a signed Azure blob. Naming a service version allows the
          # whole ZIP in one request; the API leaves plus signs unescaped.
          curl -sS --fail-with-body --connect-timeout 30 --max-time 900 --retry 2 --retry-all-errors \
            -T "$RUNNER_TEMP/store/packages.zip" -H 'x-ms-blob-type: BlockBlob' -H 'x-ms-version: 2021-08-06' \
            "${upload_url//+/%2B}"
          api POST "flights/$flight_id/submissions/$submission_id/commit" > /dev/null

          status=CommitStarted
          for _ in {1..80}; do
            sleep 15
            state="$(api GET "flights/$flight_id/submissions/$submission_id/status")"
            status="$(jq -r '.status // "unknown"' <<< "$state")"
            case "$status" in PendingCommit|CommitStarted) ;; *) break ;; esac
          done
          jq -r '.statusDetails | .errors[]?, .warnings[]? | "\(.code): \(.details)"' <<< "$state"
          case "$status" in
            PreProcessing|Certification|Release|PendingPublication|Publishing|Published) ;;
            *)
              echo "::error::Microsoft Store did not accept the submission ($status). Its reasons are above; a rerun replaces it."
              exit 1
              ;;
          esac

          # The Store reads each package's version while preprocessing it.
          confirmed=false
          for _ in {1..20}; do
            submission="$(api GET "flights/$flight_id/submissions/$submission_id")"
            if has_this_build <<< "$submission"; then
              confirmed=true
              break
            fi
            sleep 15
          done
          if [ "$confirmed" = false ]; then
            jq -r '.flightPackages[]? | "\(.fileName): \(.version // "not read yet") \(.architecture // "") \(.fileStatus)"' <<< "$submission"
            if jq -e '[.flightPackages[]? | select((.version // "") == "")] | length == 0' <<< "$submission" > /dev/null; then
              echo "::error::The flight submission does not hold x64 and arm64 $VERSION. Cancel it in Partner Center."
              exit 1
            fi
            echo "::warning::Microsoft had not read the new packages' versions yet; check them in Partner Center."
          fi
          report "Submitted \`$VERSION\` (x64, arm64) to the **Microsoft Store flight**. Once certified it goes to its testers; to release it, start an update in Partner Center and copy the packages from the flight."

  # Marketplace Trusted Publishing: vsce trades this job's GitHub OIDC token for
  # a 15-minute Marketplace credential, so no token is stored anywhere. Besides
  # upload-msix, no other job may request an OIDC token. Unlike the others it
  # needs one npm tool, vsce, so it installs from the lockfile (exact versions
  # under the cooldown) with --ignore-scripts: no install script and no
  # repository code runs here, only vsce itself. The checkout keeps no token.
  upload-vsix:
    name: Publish VS Code Extension to the Marketplace
    needs: [preflight, build-vsix]
    if: ${{ needs.preflight.outputs.publish_vscode == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Download VSIX from private draft
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_TAG: ${{ needs.preflight.outputs.draft_tag }}
        run: |
          gh release download "$DRAFT_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'docblocks-vscode-*.vsix' --dir "$RUNNER_TEMP/store"
          shopt -s nullglob
          files=("$RUNNER_TEMP"/store/*.vsix)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::Expected one .vsix on $DRAFT_TAG, found ${#files[@]}"
            exit 1
          fi
          echo "file=${files[0]}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Setup governed npm
        uses: ./.github/actions/setup-npm

      - name: Install vsce from the lockfile
        run: npm ci --ignore-scripts

      # --skip-duplicate turns an already-published version into a no-op, so a
      # rerun at an unchanged desktop version succeeds. The publisher's very
      # first version may need a hand upload of this VSIX if the Marketplace
      # refuses to create a new extension from an OIDC credential; rerun this
      # job afterwards and it skips.
      - name: Publish to the Visual Studio Marketplace
        shell: bash
        env:
          VSIX: ${{ steps.download.outputs.file }}
        run: |
          npm exec -w docblocks-vscode -- vsce publish --oidc --packagePath "$VSIX" --skip-duplicate \
            2>&1 | tee "$RUNNER_TEMP/vsce-publish.log"
          if grep -q 'is already published' "$RUNNER_TEMP/vsce-publish.log"; then
            echo "\`$(basename "$VSIX")\` was already on the **Visual Studio Marketplace**; nothing was published." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Published \`$(basename "$VSIX")\` to the **Visual Studio Marketplace**. It appears once the Marketplace finishes verifying it, usually within minutes." >> "$GITHUB_STEP_SUMMARY"
          fi
