##
# App Store Release Workflow
#
# Builds the store-submission variants of the DocBlocks desktop app:
#   - Windows: MSIX/APPX for the Microsoft Store (Partner Center)
#   - macOS:   signed .pkg for the Mac App Store (App Store Connect)
#
# These are DIFFERENT from the public installers built by desktop-release.yml:
#   - Auto-update is disabled at runtime (process.windowsStore / process.mas);
#     the stores deliver updates.
#   - They are attached only to an unpublished draft GitHub Release. Do not use
#     workflow artifacts here: in a public repository those are directly
#     downloadable from the workflow run. Maintainers download the private
#     draft assets for Partner Center / App Store Connect, then delete the
#     draft when it is no longer needed.
#   - Versions are NOT stamped with a -build.N prerelease suffix; stores require
#     a clean x.y.z version.
#
# Prerequisites (one-time setup) — see RELEASING.md:
#   Microsoft Store:  reserve the app in Partner Center, fill the appx: identity
#                     values in electron-builder.yml. No signing cert needed
#                     (the Store re-signs).
#   Mac App Store:    "Apple Distribution" + "Mac Installer Distribution" certs
#                     and a Mac App Store provisioning profile for
#                     com.bendyline.docblocks.
##

name: Release Store Builds

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which store build(s) to produce'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - windows
          - macos

permissions:
  contents: read

jobs:
  quality:
    name: Canonical Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright runtime
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run canonical quality gate
        run: xvfb-run -a npm run all

  create-draft-release:
    name: Create Private Draft Release
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Read desktop version
        id: desktop
        shell: bash
        run: |
          version="$(node --print "require('./packages/desktop/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A unique, previously unpublished tag keeps reruns isolated. GitHub does
      # not publish the release or its tag while the release remains a draft.
      - name: Create unpublished store-build draft
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: store-build-${{ github.run_id }}-${{ github.run_attempt }}
          target_commitish: ${{ github.sha }}
          name: DocBlocks Store Build v${{ steps.desktop.outputs.version }} (run ${{ github.run_number }})
          body: |
            Private store-submission build for DocBlocks Desktop v${{ steps.desktop.outputs.version }}.

            - Target: `${{ inputs.target }}`
            - Source commit: `${{ github.sha }}`
            - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            The store packages are attached only to this unpublished draft. Publishing
            the release would make it and its assets public; delete the draft after the
            packages have been submitted to the stores.
          draft: true
          prerelease: false
          make_latest: false

  # ──────────────────────────────────────────────────────────────────────────
  # Windows — Microsoft Store MSIX (unsigned; the Store re-signs on ingestion)
  # ──────────────────────────────────────────────────────────────────────────
  build-msix:
    needs: [quality, create-draft-release]
    if: ${{ inputs.target == 'both' || inputs.target == 'windows' }}
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # NB: no version stamping — the Store wants a clean x.y.z version.

      - name: Build upstream packages
        run: npm run build

      # Invoke electron-builder directly — on Windows, npm/cmd swallows the
      # `--publish` flag when forwarded through `npm run … -- --publish never`.
      - name: Build MSIX package
        working-directory: packages/desktop
        run: |
          npm run build
          npx --no-install electron-builder --win appx --publish never

      - name: Attach MSIX to private draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: store-build-${{ github.run_id }}-${{ github.run_attempt }}
          draft: true
          files: packages/desktop/dist/artifacts/*.{appx,msix}
          fail_on_unmatched_files: true

  # ──────────────────────────────────────────────────────────────────────────
  # macOS — Mac App Store .pkg (sandboxed; signed with MAS distribution certs)
  # ──────────────────────────────────────────────────────────────────────────
  build-mas:
    needs: [quality, create-draft-release]
    if: ${{ inputs.target == 'both' || inputs.target == 'macos' }}
    # Pin the signing image to match desktop-release.yml's Developer ID build.
    # `macos-latest` moved from macOS 15 to macOS 26, where codesign changed
    # behavior; keep Mac App Store signing on the same known-good image.
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # NB: no version stamping — the App Store wants a clean x.y.z version.

      - name: Build upstream packages
        run: npm run build

      - name: Import MAS certificates
        env:
          MAS_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_MAS_CERTIFICATE_P12_BASE64 }}
          MAS_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_MAS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MAS_CERTIFICATE_P12_BASE64" ]; then
            echo "::error::APPLE_MAS_CERTIFICATE_P12_BASE64 is required for a Mac App Store build"
            exit 1
          fi
          # The .p12 must contain BOTH "Apple Distribution" and
          # "Mac Installer Distribution" identities for the mas target.
          KEYCHAIN_PATH=$RUNNER_TEMP/mas-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$MAS_CERTIFICATE_P12_BASE64" | base64 --decode > $RUNNER_TEMP/mas-certificate.p12
          security import $RUNNER_TEMP/mas-certificate.p12 \
            -P "$MAS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain

      - name: Install provisioning profile
        env:
          MAS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MAS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -z "$MAS_PROVISIONING_PROFILE_BASE64" ]; then
            echo "::error::MAS_PROVISIONING_PROFILE_BASE64 is required for a Mac App Store build"
            exit 1
          fi
          echo "$MAS_PROVISIONING_PROFILE_BASE64" | base64 --decode > packages/desktop/embedded.provisionprofile

      - name: Build MAS package
        run: |
          sudo launchctl limit maxfiles 524288 524288
          ulimit -n 524288
          npm run dist:mas -w docblocks-desktop -- --publish never
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          UV_THREADPOOL_SIZE: 16

      - name: Clean up
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/mas-signing.keychain-db" 2>/dev/null || true
          rm -f packages/desktop/embedded.provisionprofile

      - name: Attach MAS package to private draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: store-build-${{ github.run_id }}-${{ github.run_attempt }}
          draft: true
          files: packages/desktop/dist/artifacts/*.pkg
          fail_on_unmatched_files: true
