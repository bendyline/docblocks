name: Release & Deploy

on:
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: 'Deploy site to GitHub Pages'
        type: boolean
        default: true
      publish_release:
        description: 'Run semantic-release (version bump + GitHub Release + tarballs)'
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write
  pull-requests: write

# Only allow one release at a time
concurrency:
  group: 'release'
  cancel-in-progress: false

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright runtime
        run: npx playwright install --with-deps chromium

      - name: Run canonical quality gate
        run: xvfb-run -a npm run all

      # ── Release ──────────────────────────────────────────────────
      # Semantic Release runs FIRST: it is what rewrites every workspace
      # manifest to the released version. Packing before it produced tarballs
      # and a vsix stamped with the previous version, so the uploaded assets
      # never matched the tag or what npm actually published.
      - name: Semantic Release
        if: inputs.publish_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx multi-semantic-release --ignore-packages=packages/site,packages/vscode --sequential-prepare

      - name: Pack tarballs
        if: inputs.publish_release
        run: |
          npm pack -w @bendyline/docblocks -w @bendyline/docblocks-react -w @bendyline/docblocks-cli
          mkdir -p release-assets
          mv *.tgz release-assets/

      - name: Package VS Code extension
        if: inputs.publish_release
        run: |
          npm run package:vscode
          mv packages/vscode/*.vsix release-assets/

      - name: Upload release assets
        if: inputs.publish_release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: release-assets/*
          retention-days: 14

      # multi-semantic-release runs @semantic-release/git once per package with
      # that package directory as cwd, so the root lockfile can never be staged
      # by the release commits themselves. Refresh it against the freshly bumped
      # workspace manifests here; without this, `npm ci` on main fails with
      # "lock file does not satisfy" until someone repairs it by hand.
      - name: Sync root lockfile
        if: inputs.publish_release
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if git diff --quiet -- package-lock.json; then
            echo "Root lockfile already matches the released manifests."
            exit 0
          fi
          git config user.name 'semantic-release-bot'
          git config user.email 'semantic-release-bot@martynus.net'
          git add package-lock.json
          git commit -m 'chore(release): sync root lockfile [skip ci]'
          git push origin HEAD:${{ github.ref_name }}

      # ── Pages ────────────────────────────────────────────────────
      - name: Build site
        if: inputs.deploy_pages
        run: npm run build -w docblocks-site

      # This is the only build whose bits reach users, and it is built here --
      # after the version bump -- so it is NOT the build `npm run all` gated in
      # CI. Any chunk over the 10 MiB precache cap drops out of the manifest
      # silently, so the offline promise has to be re-verified on this artifact.
      - name: Verify site precache manifest
        if: inputs.deploy_pages
        run: npm run check:site-precache

      - name: Upload pages artifact
        if: inputs.deploy_pages
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: packages/site/dist

  deploy-pages:
    name: Deploy Pages
    runs-on: ubuntu-latest
    needs: build
    if: inputs.deploy_pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
